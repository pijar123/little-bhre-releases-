<script>
/* installable game: offline service worker + an install strip for parents (shown on title/menu screens via body.inmenu).
   Android Chrome: real install prompt. iPhone: Share -> Add to Home Screen guide. WhatsApp/Instagram/Facebook in-app browser:
   "open in Chrome" guide + copy link. Hidden when the game already runs installed. */
(function () {
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  const ua = navigator.userAgent || "", standalone = matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches || navigator.standalone === true;
  const ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1), inapp = /FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)|TikTok/i.test(ua);
  let ev = null;
  addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); ev = e; });
  addEventListener("appinstalled", () => { ev = null; document.body.classList.add("lb-installed"); });
  window.lbCanInstall = () => !!ev;
  const css = document.createElement("style");
  css.textContent = `.lb-bar{position:fixed;z-index:8;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:none;align-items:center;gap:10px;
    background:#FFF8EC;border:3px solid #3B2418;border-radius:999px;box-shadow:0 4px 0 #3B2418;padding:6px 6px 6px 14px;font:800 14px Nunito,system-ui,sans-serif;color:#3B2418;white-space:nowrap;max-width:94vw}
  body.inmenu:not(.lb-installed):not(.lb-hidebar) .lb-bar{display:flex}
  body:has(.ov) .lb-bar,body:has(.lb-guide) .lb-bar{display:none!important}
  .lb-bar small{font-weight:700;opacity:.75}.lb-bar button{position:static;width:auto;height:auto;border:2px solid #3B2418;border-radius:999px;font:800 14px Nunito,system-ui,sans-serif;padding:7px 14px;cursor:pointer}
  .lb-bar .lb-go{background:#6FBF4E;color:#fff}.lb-bar .lb-x{background:#fff;color:#3B2418;padding:7px 10px}
  @media (max-width:420px){.lb-bar small{display:none}}
  .lb-guide{position:fixed;inset:0;z-index:30;background:rgba(43,30,58,.6);display:flex;align-items:center;justify-content:center;padding:14px;font:15px/1.4 Nunito,system-ui,sans-serif;color:#3B2418}
  .lb-guide .c{background:#FFF8EC;border:4px solid #3B2418;border-radius:24px;padding:18px 20px;max-width:380px;text-align:left}
  .lb-guide h3{font:400 24px 'Lilita One',sans-serif;color:#E8692E;margin:0 0 8px;text-align:center}.lb-guide ol{padding-left:22px;margin:6px 0}.lb-guide li{margin:6px 0}
  .lb-guide .k{display:inline-block;border:2px solid #3B2418;border-radius:8px;padding:0 6px;background:#fff;font-weight:800}
  .lb-guide button{display:block;width:100%;margin-top:10px;border:3px solid #3B2418;border-radius:14px;padding:10px;font:800 16px Nunito,system-ui,sans-serif;background:#E8692E;color:#fff}
  .lb-guide button.w{background:#fff;color:#3B2418}`;

function makeFriends(opt = {}) {
  const F = { list: [] };

  const perch = () => V.port ? { x: V.x0 + V.W * 0.83, y: 214 } : { x: Math.min(V.x1 - 150, 930), y: 214 };
  /* bird */
  if (opt.bird !== false) {
    const g = el("g", {}, back), flip = el("g", {}, g), body = el("g", {}, flip, A.friends.bird);
    const B = { g, x: perch().x, y: perch().y, st: "perch", s: V.port ? 1.6 : 1.35, face: -1, t0: now() };
    tapTarget(flip, 46, () => { if (B.st === "perch") { play("chirp", 0.7); B.fly([[B.x - 140, B.y - 150], [B.x + 60, B.y - 230], [B.x + 120, B.y - 90]], () => perch(), 2.0); } else play("chirp", 0.5, 1.2); });
    B.fly = (via, dest, d = 1.6, after) => { B.st = "fly"; B.path = { p0: [B.x, B.y], via, dest, t: now(), d, after }; };
    B.startle = () => { play("chirp", 0.6, 1.3); B.fly([[B.x + 120, B.y - 200], [V.x1 + 120, B.y - 260]], () => ({ x: V.x1 + 120, y: B.y - 260 }), 1.0, () => setTimeout(() => B.fly([[perch().x + 160, 40]], () => perch(), 1.4), 1200)); };
    B.landOn = (fn) => { WORLD.appendChild(g); B.fly([[B.x - 100, B.y - 160]], () => fn(), 1.4, () => { B.st = "ride"; B.ride = fn; play("chirp", 0.6); }); };
    B.tick = (t) => {
      if (B.st === "fly") {
        const P = B.path, u = clamp((t - P.t) / P.d), d = P.dest(), pts = [P.p0, ...P.via, [d.x, d.y]];
        let q = pts; while (q.length > 1) q = q.slice(1).map((p, i) => [lerp(q[i][0], p[0], u), lerp(q[i][1], p[1], u)]);  // bezier
        B.face = q[0][0] >= B.x ? 1 : -1; B.x = q[0][0]; B.y = q[0][1];
        if (u >= 1) { B.st = "perch"; if (P.after) P.after(); }
      } else if (B.st === "ride") { const p = B.ride(); B.x = p.x; B.y = p.y; B.face = -1; }
      const flying = B.st === "fly", hop = flying ? 0 : Math.max(0, Math.sin((t - B.t0) * 2.3)) > 0.97 ? 6 : 0;
      const fl = flying ? 1 + 0.4 * Math.sin(t * 34) : 1;
      g.setAttribute("transform", `translate(${B.x.toFixed(1)} ${(B.y - hop - 24 * B.s).toFixed(1)})`);
      flip.setAttribute("transform", `scale(${(B.face * B.s).toFixed(2)} ${(B.s * fl).toFixed(2)})`);
    };
    F.bird = B; F.list.push(B);
  }
  /* duck family walking across the yard */
  if (opt.ducks !== false) {
    const g = el("g", {}, back), D = { g, dir: 1, x: 0, next: now() + (opt.duckDelay ?? 3), walking: false, members: [] };
    [["duck", 0, 1], ["duckling", -78, 0.62], ["duckling", -140, 0.62]].forEach(([k, off, sc], i) => {
      const m = el("g", {}, g), inner = el("g", {}, m, A.friends[k]);
      D.members.push({ m, inner, off, sc, hop: 0, baby: k === "duckling", ph: i * 1.3 });
    });
    tapTarget(g, 0, () => {}); el("rect", { class: "hb", fill: "#fff", opacity: 0 }, g);
    g.addEventListener("pointerdown", () => { play("quack", 0.7); D.members.forEach((q, i) => { if (q.baby) setTimeout(() => { play("quack_baby", 0.6, 1 + i * 0.06); q.hop = now(); }, 180 + i * 160); else q.hop = now(); }); });
    D.tick = (t, dt) => {
      const y = V.port ? V.backY - 30 : 456, s = V.port ? 0.95 : 0.85;
      if (!D.walking && t > D.next) { D.walking = true; D.x = D.dir > 0 ? V.x0 - 60 : V.x1 + 60; }
      if (D.walking) { D.x += D.dir * 55 * dt; if ((D.dir > 0 && D.x + D.members[2].off * D.dir * s > V.x1 + 60) || (D.dir < 0 && D.x + D.members[2].off * D.dir * s < V.x0 - 60)) { D.walking = false; D.dir *= -1; D.next = t + 9; } }
      g.style.display = D.walking ? "" : "none";
      D.members.forEach((q) => {
        const x = D.x + q.off * D.dir * s, w = Math.sin((t + q.ph) * 9), h = q.hop ? Math.max(0, Math.sin(clamp((t - q.hop) / 0.4) * Math.PI)) * 30 : 0;
        q.m.setAttribute("transform", `translate(${x.toFixed(1)} ${(y - 42 * s * q.sc - Math.abs(w) * 3 - h).toFixed(1)}) rotate(${(w * 5).toFixed(1)})`);
        q.inner.setAttribute("transform", `scale(${(D.dir * s * q.sc).toFixed(3)} ${(s * q.sc).toFixed(3)})`);
      });
      const hb = g.querySelector("rect.hb"), x0 = Math.min(D.x, D.x + D.members[2].off * D.dir * s) - 50 * s, x1 = Math.max(D.x, D.x + D.members[2].off * D.dir * s) + 70 * s;

    tapTarget(inner, 190, () => { if (P.on && !P.loop) { P.loop = { t: now(), lx: P.x, ly: P.y }; play("whoosh", 0.8); play("tutu_happy", 0.4, 1.2); } });
    P.tick = (t, dt) => {
      const s = V.port ? 0.36 : 0.3, R = 90;
      if (!P.on && t > P.next) { P.on = true; P.x = V.x0 - 120; P.y = V.port ? V.y0 + 0.07 * V.H : 95; play("whoosh", 0.35); }
      if (!P.on) { g.style.display = "none"; return; } g.style.display = "";

      if (P.loop) {
        const u = clamp((t - P.loop.t) / 1.3), ph = u * 2 * Math.PI;
        x = P.loop.lx + R * Math.sin(ph); y = P.loop.ly - R + R * Math.cos(ph); rot = -ph * 57.3;
        if (u >= 1) P.loop = null;
      } else { P.x += 150 * dt; x = P.x; y = P.y + 6 * Math.sin(t * 2); }
      if (P.x > V.x1 + 160) { P.on = false; P.next = t + 16; }

}

  };
  function pressHint() {   // wordless: a finger pressing and the plane rising
    S.ph = el("g", { class: "nohit", transform: `translate(${X(0.6)} ${(S.top + S.bot) / 2})` }, HUD);
    S.ph.innerHTML = `<text font-size="${V.port ? 90 : 70}" text-anchor="middle" dominant-baseline="middle">👆</text><path d="M60 30 L60 -50 M44 -34 L60 -52 L76 -34" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>`;
    S.ph.animate([{ transform: `translate(${X(0.6)}px,${(S.top + S.bot) / 2}px) scale(1)` }, { transform: `translate(${X(0.6)}px,${(S.top + S.bot) / 2 + 8}px) scale(.88)` }, { transform: `translate(${X(0.6)}px,${(S.top + S.bot) / 2}px) scale(1)` }], { duration: 900, iterations: Infinity });
  }
  function dropHint() { if (S.ph) { S.ph.remove(); S.ph = null; } }
  S.down = () => { if (S.phase === "fly") { S.hold = true; dropHint(); S.lastAct = now(); if (!S.wasHold) play("whoosh", 0.25, 1.4); S.wasHold = true; } };
  S.up = () => { S.hold = false; S.wasHold = false; };
  addEventListener("keydown", (e) => { if (e.code === "Space" && scene === S) S.down(); });
  addEventListener("keyup", (e) => { if (e.code === "Space" && scene === S) S.up(); });
  function spawn() {
    const left = D.n - S.got - S.items.length; if (left <= 0) return;
    const y = lerp(S.top + 30, S.bot - 10, rnd()), g = el("g", {}, S.itemsG), star = D.stars || (D.rainbow && rnd() < 0.4), c = BCOL[(S.got + S.items.length) % BCOL.length];

    if (D.clouds && rnd() < 0.55 && !S.hazards.length) { const hg = el("g", {}, S.hazG); hg.innerHTML = cloudSVG(true); S.hazards.push({ g: hg, x: V.x1 + 260, y: lerp(S.top + 40, S.bot - 20, rnd()) }); }

    if (S.got >= D.n) { S.phase = "land"; S.hold = false; dropHint(); cue(0.3, land); }
  }

    S.carried.forEach((c, i) => setTimeout(() => { const g = el("g", {}, FX); g.innerHTML = `<g transform="scale(.7)">${balloonSVG(c)}</g>`;
      g.animate([{ transform: `translate(${S.x - 80}px,${S.y - 90}px)` }, { transform: `translate(${S.tutu.x - 20 + (i % 3) * 22}px,${S.tutu.g - 260 * S.tutu.s - (i % 2) * 30}px)` }], { duration: 700, easing: "cubic-bezier(.3,1.2,.5,1)", fill: "forwards" }); play(XYLO[i % 5], 0.5); }, i * 120));
    S.carried = []; drawBunch();
    word(480, V.port ? V.y0 + V.H * 0.3 : 200, "YAY!", "#E8692E", V.port ? 110 : 100, -6, 1.6);
    S.tutu.hop(70, 0.6); play("tutu_laugh", 0.7, 1, 0.3); play(n % 2 ? "bhre_yeay" : "bhre_laugh", 0.9, 1, 0.5); S.plIn.innerHTML = planeSVG("happy");
    if (D.rainbow) for (let i = 0; i < 7; i++) setTimeout(() => burst(X(0.15 + 0.7 * rnd()), V.y0 + 120, 12, { kind: "star", v: 320, r: 16, a0: 0, spread: Math.PI * 2, g: 200, life: 1.6 }), i * 200);

  }
  function endButtons() {
    const y = V.port ? V.y0 + V.H * 0.2 : 112, r = V.port ? 70 : 54, dx = V.port ? 170 : 150;
    bigButton(480 - dx, y, r * 0.85, icoMenu, () => go(sceneMenu), "#9B6FD6");
    bigButton(480, y, r * 0.85, icoAgain, () => go(() => sceneLevel(n)), "#3BA3D9");
    if (n < 10) bigButton(480 + dx, y, r * 1.1, icoArrow, () => playLevel(n + 1), "#6FBF4E"); else grownUpButton(480 + dx, y, r);
  }
  S.tick = (t, dt) => {
    S.friends && S.friends.tick(t, dt);
    const flying = S.phase === "fly" || S.phase === "intro", sp = S.phase === "win" ? 0 : S.phase === "land" ? speed * 0.6 : speed;
    S.scroll += sp * dt * 0.35;
    S.groundTiles.forEach((g) => { const x = V.x0 - 40 + ((g.i * S.groundW / 2 - S.scroll) % (S.groundW * 2) + S.groundW * 2) % (S.groundW * 2) - S.groundW / 2; g.g.setAttribute("transform", `translate(${x.toFixed(1)} 0)`); });
    // plane: fly in, then hold = up / release = down (soft, never crashes)
    if (S.phase === "intro") S.x = lerp(V.x0 - 200, S.px, easeOut((t - S.enter) / 1.1));
    if (flying && S.phase === "fly") {

      S.y += S.vy * dt; if (S.y < S.top) { S.y = S.top; S.vy = 0; } if (S.y > S.bot) { S.y = S.bot; S.vy = Math.min(0, S.vy); }

      const u = clamp((t - S.landing) / 2.4); S.tx = lerp(V.x1 + 160, X(0.72), easeOut(u));
      const gy = S.groundY - 20; S.tutu.at(S.tx, gy, V.port ? 0.5 : 0.45);
      S.y = lerp(S.y, gy - 70, 0.04); S.x = lerp(S.x, X(0.42), 0.03); S.vy = 0;
      if (u >= 1 && !S.landed) { S.landed = true; play("wood", 0.6); win(); }
    }
    S.tutu && S.tutu.root.style.display !== "none" && S.tutu.tick(t);
    const tilt = S.phase === "land" ? 6 : clamp(S.vy * 0.04, -12, 10), bob = Math.sin(t * 3) * 3;
    S.pl.setAttribute("transform", `translate(${S.x.toFixed(1)} ${(S.y + bob).toFixed(1)}) rotate(${tilt.toFixed(1)}) scale(${PS()})`);
    S.bunch.setAttribute("transform", `translate(${S.x.toFixed(1)} ${(S.y + bob).toFixed(1)}) rotate(${(tilt * 0.5).toFixed(1)}) scale(${PS() * 1.3})`);

    for (const it of S.items.slice()) {
      it.x -= sp * dt; const d = Math.hypot(it.x - (S.x + 30), it.y - S.y);
      if (d < magnet && it.x > S.x - 60) { it.x = lerp(it.x, S.x + 30, 0.06); it.y = lerp(it.y, S.y, 0.06); }
      if (d < 60 * IS()) { collect(it); continue; }
      if (it.x < V.x0 - 100) { it.g.remove(); S.items.splice(S.items.indexOf(it), 1); continue; }   // missed: a new one comes later
      it.g.setAttribute("transform", `translate(${it.x.toFixed(1)} ${(it.y + Math.sin(t * 2 + it.ph) * 8).toFixed(1)}) rotate(${(Math.sin(t * 1.6 + it.ph) * 6).toFixed(1)}) scale(${(it.star ? 0.9 : 0.85) * IS()})`);
    }
    for (const h of S.hazards.slice()) {
      h.x -= sp * dt * (h.bird ? 1.3 : 0.8);
      const hit = Math.abs(h.x - S.x) < (h.bird ? 50 : 90) && Math.abs(h.y - S.y) < (h.bird ? 40 : 60);
      if (hit && !h.hit) { h.hit = true; if (h.bird) { play("chirp", 0.7); h.y -= 60; } else { play("slap", 0.3); sfx("pop", 0.3, 0.6); S.vy = 160; S.plIn.innerHTML = planeSVG("wow"); setTimeout(() => S.plIn && (S.plIn.innerHTML = planeSVG()), 700); burst(S.x, S.y, 10, { kind: "drop", v: 160, r: 7, a0: 0, spread: Math.PI * 2, g: 500, life: 0.8 }); } }
      if (h.x < V.x0 - 200) { h.g.remove(); S.hazards.splice(S.hazards.indexOf(h), 1); continue; }
      const f = h.bird ? 1 + 0.35 * Math.sin(t * 30 + h.ph) : 1;
      h.g.setAttribute("transform", `translate(${h.x.toFixed(1)} ${(h.y + (h.bird ? Math.sin(t * 4 + h.ph) * 10 : 0)).toFixed(1)}) scale(${h.bird ? 1 : 0.8} ${h.bird ? f : 0.8})`);
    }
    // gentle speed lines + white clouds drifting in the back
    if (!S.bgClouds) { S.bgClouds = [0, 1, 2].map((i) => { const g = el("g", { opacity: 0.85 }, S.cloudsBack); g.innerHTML = cloudSVG(false); return { g, x: X(0.2 + 0.35 * i), y: V.y0 + 80 + i * 50 }; }); }
    for (const c of S.bgClouds) { c.x -= sp * dt * 0.25; if (c.x < V.x0 - 150) c.x = V.x1 + 150; c.g.setAttribute("transform", `translate(${c.x.toFixed(1)} ${c.y}) scale(.7)`); }
  };
  return S;
}

    const ord = orderCode(), dev = DEVICE;
    const msg = `Halo, saya sudah bayar ${PAY.label} ${PAY.priceTxt} untuk game ${PAY.game}\nKode pesanan: ${ord}\n(bukti bayar saya kirim setelah pesan ini)`;
    const qr = PAY.qris.startsWith("data:") ? `<img src="${PAY.qris}" alt="QRIS">` : `<span class="small">QRIS Titik Kumpul</span>`;
    const o = overlay(`<h2>Buka Level 4–10</h2><p>7 level baru: awan hujan, kawanan burung, terbang senja dan malam mengumpulkan bintang, sampai 10 balon dan pelangi.</p>
      <p style="font:400 30px 'Lilita One',sans-serif;margin:4px 0">${PAY.priceTxt}</p><p class="small">sekali bayar · tanpa iklan · tanpa data pribadi · bisa dimainkan tanpa internet</p>
      <div class="qr">${qr}</div><p>Kode pesanan</p><div class="code">${ord}</div>
      <ol><li>Scan QRIS di atas, bayar <b>${PAY.priceTxt}</b> ke Titik Kumpul (DANA).</li><li>Tekan <b>Kirim ke WhatsApp</b> (kode pesanan terisi otomatis).</li><li>Tempel balasan kode buka di bawah, lalu tekan <b>Buka</b>.</li></ol>
      <a class="btn wa" href="${PAY.waLink}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Kirim ke WhatsApp (${PAY.whatsapp})</a>
      <textarea id="uc" placeholder="Tempel balasan WhatsApp (berisi kode unlock) di sini"></textarea><div class="err" id="ue"></div>
      <button class="btn go" id="ub">Buka</button><p class="small">Kode unlock hanya berlaku di HP ini (kode perangkat ${dev}). Jangan hapus data browser.</p>`);
    o.querySelector("#ub").onclick = () => {
      if (tryUnlock(o.querySelector("#uc").value)) { o.remove(); celebrateUnlock(); if (after) after(); }
      else { o.querySelector("#ue").textContent = "Kode belum cocok. Cek lagi balasan dari WhatsApp."; const c = o.querySelector(".card"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); }
    };
  });
}
function celebrateUnlock() { audioInit(); sfx("sparkle", 1.3); play("bhre_yeay", 1); for (let i = 0; i < 5; i++) setTimeout(() => burst(V.x0 + V.W * (0.15 + 0.7 * Math.random()), V.y0 + 140, 14, { kind: "star", v: 320, r: 16, a0: 0, spread: Math.PI * 2, g: 200, life: 1.6 }), i * 180); if (scene && scene.name === "menu") go(sceneMenu); }
function playLevel(n) { if (levelLocked(n)) openPay(() => go(() => sceneLevel(n))); else go(() => sceneLevel(n)); }

/* grown-up button: opens the parent gate, then the YouTube link */
function grownUpButton(x, y, r) {
  const g = el("g", { class: "hit", transform: `translate(${x} ${y})` }, HUD);
  el("circle", { r: r + 6, fill: OUT, cy: 7 }, g); el("circle", { r: r + 6, fill: OUT }, g); el("circle", { r, fill: "#fff" }, g);
  g.insertAdjacentHTML("beforeend", `<g transform="scale(${r / 60})"><rect x="-26" y="-18" width="52" height="36" rx="10" fill="#E5484D"/><path d="M-7 -9 L11 0 L-7 9Z" fill="#fff"/>
    <g transform="translate(26 26)"><rect x="-11" y="-4" width="22" height="18" rx="4" fill="${OUT}"/><path d="M-6 -4 V-10 A6 6 0 0 1 6 -10 V-4" fill="none" stroke="${OUT}" stroke-width="4"/></g></g>`);
  g.addEventListener("pointerdown", (e) => { e.stopPropagation(); audioInit(); sfx("pop", 0.5, 1.2); openYouTube(); });
}

/* ---------------- loop + input ---------------- */
function go(fn) { endScene(); clearAll(); scene = fn(); document.body.classList.toggle("inmenu", scene.name === "menu" || scene.name === "title"); layout(); scene.start(); }
function goTitle() { go(sceneTitle); }
let last = now();
function loop() { const t = now(), dt = Math.min(0.05, t - last); last = t; if (scene && scene.tick) scene.tick(t, dt); tickParts(t, dt); tickWords(t); tickHint(t); musicTick(); requestAnimationFrame(loop); }
SV.addEventListener("pointerdown", (e) => { audioInit(); if (scene && scene.down) scene.down(e); });
SV.addEventListener("pointermove", (e) => { if (scene && scene.move) scene.move(e); });
addEventListener("pointerup", (e) => { if (scene && scene.up) scene.up(e); });
addEventListener("pointercancel", (e) => { if (scene && scene.up) scene.up(e); });
document.addEventListener("visibilitychange", () => { if (AC) { if (document.hidden) AC.suspend(); else AC.resume(); } });
layout(); goTitle(); requestAnimationFrame(loop);
</script>
</body>
